name: CI

on:
  push:
    branches: [main, "completion/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal, clang)
            os: macos-latest
            preset: ci-macos
            exe: build/ci-macos/neo_wolf
            autoplay: build/ci-macos/neo_wolf_autoplay
          - name: Windows (MSVC x64)
            os: windows-latest
            preset: ci-windows-msvc
            exe: build/ci-windows-msvc/Release/neo_wolf.exe
            autoplay: build/ci-windows-msvc/Release/neo_wolf_autoplay.exe
          - name: Linux (gcc)
            os: ubuntu-latest
            preset: ci-linux
            exe: build/ci-linux/neo_wolf
            autoplay: build/ci-linux/neo_wolf_autoplay

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (native + DevKit + content validation)
        run: ctest --preset ${{ matrix.preset }}

      - name: Headless smoke run
        run: python tools/ci/smoke_run.py ${{ matrix.exe }} --frames 300

      # Roadmap Phase 7: the autoplay bot plays the whole campaign (real engine, simulated
      # input, carry-over checked). Runs even when an earlier step failed, so the report is
      # always uploaded; a level the bot cannot finish fails the job.
      - name: Autoplay bot (whole campaign)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ${{ matrix.autoplay }} --all --json autoplay-report-${{ matrix.preset }}.json

      - name: Upload autoplay report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: autoplay-report-${{ matrix.preset }}
          path: autoplay-report-${{ matrix.preset }}.json
          if-no-files-found: warn

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/autoplay/*.json
          if-no-files-found: ignore

  package:
    # Roadmap Phase 9: the release packages, built through the user-facing scripts (package.sh /
    # package.cmd -> DevKit `package` -> the package-<os> CMake preset), checked by
    # tools/ci/package_smoke.py (extracted to a path with spaces, run headless from there and from
    # the file-system root; macOS: codesign, lipo, otool; Windows: PE subsystem, icon and version
    # resource, no runtime DLLs) and uploaded with SHA256SUMS. On a v* tag the package must carry
    # the tag's version (docs/RELEASE.md). Linux packages are best effort and not built here.
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
          - name: Windows x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Release tag must match the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "NEOWOLF_EXPECT_ARGS=--expect-version ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the package (package.sh)
        id: package_unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./package.sh --out-dir dist --clean $NEOWOLF_EXPECT_ARGS

      - name: Build the package (package.cmd)
        id: package_windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call package.cmd --out-dir dist --clean %NEOWOLF_EXPECT_ARGS%

      - name: Package smoke test
        run: python tools/ci/package_smoke.py dist

      - name: Upload the package and SHA256SUMS
        if: ${{ !cancelled() && (steps.package_unix.outcome == 'success' || steps.package_windows.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: neo-wolf-package-${{ runner.os }}
          path: |
            dist/neo-wolf-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  windows-scripts:
    # Exercises the user-facing Windows entry points (vswhere lookup, generator pinning,
    # exit-code propagation) that the preset-based job above bypasses.
    name: Windows build scripts (build.cmd / build.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build.cmd (Release, from Command Prompt)
        shell: cmd
        run: build.cmd

      - name: build.ps1 -Config Debug (Windows PowerShell 5.1)
        shell: powershell
        run: .\build.ps1 -Config Debug

      # The package scripts' Python lookup and exit codes, without a second full build (the
      # package job builds the real package through package.cmd).
      - name: package.cmd and package.ps1 pass exit codes on
        shell: cmd
        run: |
          call package.cmd 1.0.0
          if %ERRORLEVEL% NEQ 2 (echo package.cmd 1.0.0: expected exit code 2, got %ERRORLEVEL% & exit /b 1)
          call package.cmd --no-such-option
          if %ERRORLEVEL% NEQ 2 (echo package.cmd --no-such-option: expected exit code 2, got %ERRORLEVEL% & exit /b 1)
          powershell -NoProfile -ExecutionPolicy Bypass -File package.ps1 --no-such-option
          if %ERRORLEVEL% NEQ 2 (echo package.ps1 --no-such-option: expected exit code 2, got %ERRORLEVEL% & exit /b 1)
          echo package scripts: exit codes OK
          rem echo does not reset ERRORLEVEL; without this the step inherits the expected 2.
          exit /b 0
