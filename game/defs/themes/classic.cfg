# Texture theme "classic": the original 8x8 textures (formerly game/defs/wall_textures.cfg).
# No campaign level uses it today; it stays available to level authors. Its exit switch is
# generated by tools/devkit/gen_textures.py, and so are its locked doors (door_red, door_blue,
# door_gold). Paths are relative to the content root.
wall=game/assets/wall_main.ppm
wall_alt_a=game/assets/wall_alt_a.ppm
wall_alt_b=game/assets/wall_alt_b.ppm
door=game/assets/wall_alt_b.ppm
door_red=game/assets/themes/classic/door_red.ppm
door_blue=game/assets/themes/classic/door_blue.ppm
door_gold=game/assets/themes/classic/door_gold.ppm
floor=game/assets/floor.ppm
ceiling=game/assets/ceiling.ppm
exit=game/assets/themes/classic/exit.ppm
